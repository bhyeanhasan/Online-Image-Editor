{% extends 'base.html' %}
{% load static %}

{% block title %}Home - Online Image Editor{% endblock %}

{% block extra_css %}
<link href="{% static 'css/index.css' %}" rel="stylesheet">
{% endblock %}

{% block content %}
<div class="upload-card">
    <div class="logo-container">
        <img src="{% static 'logo_new.png' %}" alt="Image Editor Logo" class="logo-img img-fluid">
    </div>

    <h1 class="mb-4">Online Image Editor</h1>

    <form action="{% url 'getImage' %}" method="post" enctype="multipart/form-data">
        {% csrf_token %}

        <label for="imageToEdit" class="file-upload-wrapper">
            <input type="file" id="imageToEdit" name="imageToEdit" required onchange="updateFileName(this)">
            <div id="file-upload-label" class="text-muted">
                <i class="fas fa-cloud-upload-alt fa-3x mb-3"></i>
                <h5>Select Image to Edit</h5>
                <p>Click to browse files</p>
            </div>
        </label>

        <button type="submit" class="btn btn-primary btn-lg w-100">
            <i class="fas fa-magic"></i> Open Editor
        </button>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script>
    function updateFileName(input) {
        const fileName = input.files[0] ? input.files[0].name : "Choose an Image...";
        document.getElementById('file-upload-label').innerHTML = `
            <i class="fas fa-image fa-3x mb-3 text-primary"></i>
            <h5 class="text-primary">${fileName}</h5>
            <p class="text-success">Ready to upload</p>
        `;
    }
</script>
{% endblock %}
