{% load static %}
<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Home - Online Image Editor</title>

    <!-- Custom CSS -->
    <link href="{% static 'css/index.css' %}" rel="stylesheet">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

    <!-- Script to handle file name display -->
    <script>
        function updateFileName(input) {
            const fileName = input.files[0] ? input.files[0].name : "Choose an Image...";
            document.getElementById('file-upload-label').innerHTML = '<i class="fas fa-image"></i> ' + fileName;
        }
    </script>
</head>

<body>

    <div class="main-container">

        <div class="logo-container">
            <img src="{% static 'logo_new.png' %}" alt="Image Editor Logo">
        </div>

        <h1>Online Image Editor</h1>

        <form action="{% url 'getImage' %}" method="post" enctype="multipart/form-data" class="upload-container">
            {% csrf_token %}

            <div class="file-upload-wrapper" onclick="document.getElementById('imageToEdit').click()">
                <input type="file" id="imageToEdit" name="imageToEdit" required onchange="updateFileName(this)">
                <span class="file-upload-text" id="file-upload-label">
                    <i class="fas fa-cloud-upload-alt"></i> Select Image to Edit
                </span>
            </div>

            <button type="submit" class="btn-primary-custom">
                <i class="fas fa-magic"></i> Open Editor
            </button>
        </form>

        <div class="nav-links">
            <a href="{% url 'canvas' %}" class="nav-link-item"><i class="fas fa-palette"></i> Canvas</a>
            <a href="admin/" class="nav-link-item"><i class="fas fa-user-shield"></i> Admin</a>
        </div>

    </div>

</body>

</html>
